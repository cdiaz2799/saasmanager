        snapshot. No events older than 30 days are retained. Consumers persist each processed event ID
        before acknowledging.
webhooks:
  entityChanged:
    post:
      summary: Deliver an entity change to a registered subscriber
      operationId: receiveEntityChange
      description: At-least-once delivery, with no global ordering guarantee. Sign exact raw request bytes
        using HMAC-SHA256 over timestamp + dot + raw body. Accept timestamps within five minutes, verify
        in constant time, and deduplicate by event ID. Retry with exponential backoff for up to 24 hours,
        then use /events replay (30 days). Signing secret rotation allows a bounded overlap. 2xx acknowledges
        a durably accepted event. This is an outbound webhook, not a server endpoint.
      security: []
      parameters:
      - name: X-Event-Id
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Event-Timestamp
        in: header
        required: true
        schema:
          type: string
          pattern: ^[0-9]+$
        description: Unix time in seconds.
      - name: X-Event-Signature
        in: header
        required: true
        schema:
          type: string
          pattern: ^sha256=[0-9a-f]{64}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '204':
          description: Event durably accepted.
        '400':
          description: Invalid signature, timestamp, or payload.
        '503':
          description: Temporary receiver failure; sender retries.
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.saas-record.example/oauth/token
          scopes:
            catalog:read: Read authorized catalog records.
            catalog:write: Manage authorized catalog records.
            identity:read: Read authorized identity records.
            identity:write: Manage authorized identity records.
            financial:read: Read authorized financial records.
            financial:write: Manage authorized financial records.
            usage:read: Read authorized usage records.
            usage:write: Manage authorized usage records.
            integrations:read: Read authorized integrations records.
            integrations:write: Manage authorized integrations records.
            provenance:read: Read authorized provenance records.
            provenance:write: Manage authorized provenance records.
            observations:read: Read authorized observations records.
            audit:read: Read authorized audit records.
            events:read: Read authorized events records.
            events:write: Manage authorized events records.
        authorizationCode:
          authorizationUrl: https://auth.saas-record.example/oauth/authorize
          tokenUrl: https://auth.saas-record.example/oauth/token
          scopes:
            catalog:read: Read authorized catalog records.
            catalog:write: Manage authorized catalog records.
            identity:read: Read authorized identity records.
            identity:write: Manage authorized identity records.
            financial:read: Read authorized financial records.
            financial:write: Manage authorized financial records.
            usage:read: Read authorized usage records.
            usage:write: Manage authorized usage records.
            integrations:read: Read authorized integrations records.
            integrations:write: Manage authorized integrations records.
            provenance:read: Read authorized provenance records.
            provenance:write: Manage authorized provenance records.
            observations:read: Read authorized observations records.
            audit:read: Read authorized audit records.
            events:read: Read authorized events records.
            events:write: Manage authorized events records.
      description: Machine clients use client credentials. Interactive clients use authorization code
        with PKCE. Validate issuer, audience, expiry, and tenant claim. Tenant admin/RBAC provisioning
        and credential exchange are outside this resource API.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque server token. Continue with the same filter values; do not parse or construct.
    UpdatedSince:
      name: updated_since
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Inclusive server updated_at lower bound; includes retired records. Deduplicate IDs/revisions
        across sync boundaries.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
      description: Quoted current revision. Wildcard and weak ETags are not accepted.
  responses:
    BadRequest:
      description: Malformed request, unknown query parameter, invalid cursor, or missing Idempotency-Key.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer authentication challenge.
    Forbidden:
      description: Insufficient capability for the operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource does not exist or is not visible to this tenant/caller.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Duplicate natural key, source-managed field, invalid lifecycle transition, overlapping
        interval, or reused idempotency/source-version key with different content.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: Cursor or event replay position expired.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooLarge:
      description: Request exceeds record or batch byte limits.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: If-Match does not equal current revision.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Schema-valid input violates a domain invariant or registered connector schema.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: Required If-Match header is missing.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Rate limit exceeded.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Seconds until retry.
    InternalError:
      description: Unexpected server error. Use request_id for support; do not expose internals.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: Queue unavailable. Request not accepted; retry with the same idempotency key.
