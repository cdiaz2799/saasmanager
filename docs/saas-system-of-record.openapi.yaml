      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/UpdatedSince'
      description: Returns authorized records, including all lifecycle states unless filtered. Cursors
        bind filters and a consistent snapshot for 15 minutes; expired cursors return 410. Default order
        is created_at ASC, id ASC.
    post:
      summary: Create Vendor
      operationId: createVendor
      tags:
      - Catalog
      security:
