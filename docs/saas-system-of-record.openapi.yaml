openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: SaaS System of Record API
  version: 0.1.0
  description: |-
    Proposed v1 contract, not an implemented or deployed service. Stable canonical inventory with source provenance, identity, commercial rights, observed access, actual spend, and architecture relationships.

    All resource IDs and foreign keys are scoped by tenant_id taken from a verified OAuth2 access token. Tokens are bound to exactly one tenant. Field/row authorization is enforced beyond listed coarse scopes, including referenced resources, graph projections, evidence, events, and pagination. Inaccessible IDs return 404.

    POST requires Idempotency-Key. Scope: tenant + authenticated client + method + canonical path. Store the request hash and original response for at least 24 hours; same content replays the original result, different content returns 409. Permanent source-observation deduplication also applies independently.

    PATCH uses application/json with typed partial-update schemas. Omission preserves a field, nullable null clears it, and objects/arrays replace whole values. If-Match is a required strong revision ETag. Validation failures are application/problem+json. Resources have no public hard-delete operations; retire or end-date them while retaining references and history. Connector-owned state cannot be overridden through ordinary CRUD.

    Dates use [start,end) intervals; timestamps are RFC 3339 in UTC. Contract deadlines retain an IANA timezone. Decimal money and quantities are strings. List defaults: limit 100, maximum 200; created_at/id ascending; opaque signed cursor bound to filters, authorization, and a consistent 15-minute snapshot. Unknown query parameters return 400. Revoked permissions are enforced on every page.

    202 only acknowledges queued work. Canonical reads become current after successful reconciliation; each ingestion item has a terminal result. Manual writes are immediately readable, while derived projections and analytics may lag and expose freshness/as-of timestamps. Changing a record never executes a vendor action.

    Client schemas are closed except documented labels, annotations, extensions, and connector-native payloads. Domain rules involving other resources, intervals, allowed transitions, and field authority require server-side validation beyond JSON Schema.
servers:
- url: https://api.saas-record.example/v1
  description: Illustrative server; replace for implementation.
security:
- OAuth2:
  - catalog:read
